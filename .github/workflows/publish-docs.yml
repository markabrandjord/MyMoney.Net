name: Publish Docs
on:
  push:
    branches: [ master ]

# mkdocs gh-deploy pushes the built site to the gh-pages branch using the
# default GITHUB_TOKEN, which needs write access to do that -- the repo-wide
# default token permission is left at read (see ci.yml's reasoning about
# handing workflows the least token that does the job), so this workflow
# opts in to write explicitly, scoped to just itself.
permissions:
  contents: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pip
        run: python3 -m pip install --upgrade pip setuptools wheel
      - name: Install MkDocs
        run: |
          pip install mkdocs
          pip install mkdocs-macros-plugin
      - name: MkDocs build
        run: mkdocs build
      - name: MkDocs deploy
        run: mkdocs gh-deploy --force
