name: build-and-test

# Runs on a GitHub-hosted windows-latest runner, not the Genoa self-hosted
# runner the original repo used -- this fork (markabrandjord/MyMoney.Net)
# is PUBLIC, and self-hosted runners must never be pointed at a public
# repo's pull_request event (any fork's PR would execute on that hardware).
# GitHub-hosted runners are ephemeral per-job VMs, so a public repo is fine.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A second push while a run is in flight cancels the first: the older
# result is about code nobody is looking at any more.
concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

# Read-only. Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      # Pinned to a commit SHA, not a tag: a tag can be repointed at new
      # code, and this workflow executes pull-request code (including from
      # forks). persist-credentials: false because nothing here needs git
      # write access.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # windows-latest's preinstalled SDKs drift over time; pin explicitly
      # so a GitHub-side image update can't silently change which SDK
      # builds this net10.0-windows7.0 project.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Environment
        run: |
          "dotnet     : $(dotnet --version)"
          "git        : $(git --version)"
          "runner     : $env:RUNNER_NAME on $env:COMPUTERNAME"

      - name: Build (Debug)
        run: dotnet build Source/WPF/MyMoney.sln -m:1

      # Release-only compile breaks are real (conditional-compilation
      # directives, optimization-dependent code) and the retired
      # dotnet-desktop.yml workflow caught this config -- so verify it still
      # builds. Not re-running the test suite against Release: the tests
      # exercise logic, not the optimizer, and doubling every test run to
      # catch a config-specific compile error is the wrong trade.
      - name: Build (Release)
        run: dotnet build Source/WPF/MyMoney.sln -c Release -m:1

      # UnitTests and MyMoney.TestSupport only -- see docs/dev/index.md.
      # ScenarioTest and UITests are excluded: both drive real Windows UI
      # via FlaUI/DGML automation, which needs an interactive desktop
      # session. This runner is a Windows Service (Session 0), so those
      # projects can't work here regardless of code correctness -- the
      # same reason ScenarioTest is documented as "not run via dotnet
      # test" even for local development.
      #
      # SqlServerDatabaseContractTests/SqlServerStoredProcDatabaseTests fail
      # fast (by design, not skip) without MYMONEY_TEST_SQLSERVER_* env vars
      # -- see docs/dev/index.md -- so they're excluded by name. NOTE:
      # `--filter "TestCategory!=RequiresSqlServer"` looks like it should do
      # the same thing but does NOT actually exclude them with this
      # NUnit3TestAdapter version (verified locally: --list-tests still
      # shows all of SqlServerDatabaseContractTests with that filter, while
      # `FullyQualifiedName!~SqlServerDatabaseContractTests` correctly drops
      # them) -- a real, silent footgun for anyone tempted to "clean this up"
      # to the category filter later. Wiring up a live SQL Server connection
      # for CI is a separate, deliberate follow-up, not something to default
      # into silently here.
      - name: Test
        run: |
          dotnet test Source/WPF/UnitTests/UnitTests.csproj -m:1 --logger "trx;LogFileName=UnitTests.trx"
          dotnet test Source/WPF/MyMoney.TestSupport/MyMoney.TestSupport.csproj -m:1 --filter "FullyQualifiedName!~SqlServerDatabaseContractTests" --logger "trx;LogFileName=MyMoney.TestSupport.trx"

      - name: Test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            Source/WPF/UnitTests/TestResults/*.trx
            Source/WPF/MyMoney.TestSupport/TestResults/*.trx
          if-no-files-found: warn
